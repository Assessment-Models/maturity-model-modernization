      outcome: OUT-B1
      opportunity: O-B1
      statement: "Faster, lower-risk partner onboarding on the standardized integration pattern."
      status: expected
      expected: "Reduced partner onboarding effort and integration defect escape, consistent with the value factors recorded for O-B1."
      measure: { id: integration-onboarding-lead-time, version: "1.0.0" }
      date: "2026-04-16"
      successor_assessment: null
      basis_findings: [F-B1, F-B5]
