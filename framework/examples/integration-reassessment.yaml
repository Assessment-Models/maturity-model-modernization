realization:
  metamodel: "ama-metamodel 1.0.0"
  assessment: AS-EXAMPLE-integration-B
  interventions:
    - id: IV-B1
      opportunity: O-B1
      statement: "Standardize integration as managed services with shared contracts."
      rationale: "Team B's independently derived course of change closing the gap profile of O-B1 onto the target position anchored by RES-07B; the staged shape respects F-B3 and the preparatory stage respects F-B6. Proposed, not committed: a second opinion does not execute."
      profile: critical
      status: proposed
  capability_implications:
