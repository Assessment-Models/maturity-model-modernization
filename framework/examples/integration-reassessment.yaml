    - { id: CAP-B2, intervention: IV-B1, capability: "Integration service contract governance and discoverability", kind: introduces, affected_dimension: D4.4.1, notes: "Anchors the fan-out implications IMP-B-DATA-1 and IMP-B-SVC-1." }
  decisions:
