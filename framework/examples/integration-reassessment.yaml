      statement: "Adopt the managed integration service pattern with contract-first onboarding."
      intervention: IV-B1
      decides: IV-B1
      status: proposed
      options_considered: [OPT-B1, OPT-B2, OPT-B3]
      consequences: "Option set of O-B1 resolved in favor of OPT-B1 by team B; recorded as proposed pending reconciliation with the recorded assessment before acceptance."
      decided_by: "Team B (proposed); reconciliation with the Architecture Review Board pending"
  initiatives:
    - id: INIT-B1
      statement: "Staged integration service standardization (proposed)."
      intervention: IV-B1
      objectives: [OBJ-B1]
      stages:
        - { id: stage-1, name: "Automated regression coverage for the top integration flows", status: proposed, target: "Regression tests in CI for the two highest-criticality integration paths", closes: [F-B6], outputs: ["Shared test capability and interface contracts in CI"] }
        - { id: stage-2, name: "Contract-first pilot on two partner flows", status: proposed, target: "Pilot flows live on the shared contract pattern with automated regression", closes: [F-B1, F-B5], outputs: ["Service contract template", "Discoverability registry pilot"] }
        - { id: stage-3, name: "Estate rollout with dependency tolerance work", status: proposed, target: "Mechanisms consolidated onto the standard pattern; exposures inside tolerance", closes: [F-B2, F-B3, F-B4], outputs: ["Managed interface inventory", "Retired point-to-point interfaces"] }
