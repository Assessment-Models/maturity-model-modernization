    - { id: IT-SOFTWARE-DEFICIENCY, domain: software, phrasing: "Introduce modular components and decoupled interfaces.", criterion_cap: D5.4 }
    - { id: IT-TECHNOLOGY-DEMAND, domain: technology, phrasing: "Scale identity and KYC execution to the committed digital load.", criterion_cap: D2.4 }
