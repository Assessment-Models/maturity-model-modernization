opportunity_set:
  metamodel: "ama-metamodel 1.0.0"
  assessment: AS-EXAMPLE-onboarding
  opportunities:
    - id: O-1
      statement: "Onboarding consolidation onto a single customer identity."
      narrative: "Consolidate the three onboarding applications onto a single customer identity service with automated KYC orchestration, closing the compliance exposure, the fitness gap, and the fragmentation, while meeting the committed digital onboarding demand."
      finding_ids: [F-1, F-2, F-3, F-4]
      asset_findings: [F-6, F-8]
      constraint_findings: [F-5]
      dimensions: [D1, D2, D4, D5, D8]
      closes_gap_profile:
        - { criterion: D2.3.1, result: RES-01, target: 3 }
        - { criterion: D4.1.1, result: RES-02, target: 3 }
        - { criterion: D5.4.1, result: RES-03, target: 4 }
        - { criterion: D2.4.1, result: RES-04, target: 3 }
      target_position: TGT-1
      option_set:
        - { id: OPT-1, description: "Single customer identity service with automated KYC orchestration, staged journey by journey." }
        - { id: OPT-2, description: "Front-end-only journey rework; leaves the tri-application split and closes little of the gap profile." }
        - { id: OPT-3, description: "Package replacement of all three applications in one big bang; conflicts with constraint F-5 and the fixed regulatory timeline." }
      significance:
        strategic_importance: { level: high, basis: ["Criticality overlay critical on the compliance-critical paths", "Growth strategy names digital onboarding as a headline capability (F-6)"] }
        modernization_need: { level: high, basis: [F-1, F-3] }
        future_demand: { level: high, basis: [F-4] }
        exposure: { level: high, basis: [F-1] }
        value_potential: { level: medium, basis: [RES-09] }
        urgency: { level: high, basis: ["Fixed 2027 regulatory deadline (RES-01); committed trigger with a fixed date"] }
        feasibility: { level: medium, basis: [F-5] }
        readiness: { level: medium, basis: [RES-07] }
        dependency: { level: low, basis: ["No other recorded opportunity in this assessment is enabled or blocked"] }
      profile:
        primary: critical
        secondary: strategic
        rationale: "Need high (F-1, F-3), strategic importance high, material-or-severe exposure finding inside (F-1 severe): Critical Modernization satisfied and, by dominance order, primary (R-PRI-2). Strategic also holds (future demand high via F-4, value potential medium, target defined via RES-09), recorded as secondary."
      status: active
      review_date: "2026-08-20"
    - id: O-2
      statement: "Onboarding decision-path documentation consolidation."
      narrative: "Record the KYC routing decision paths and the issuance interfaces for the onboarding stream; deliberately recorded as standby: no profile condition is satisfied and the finding is moderate, so it is scheduled for review rather than force-fit (R-PRI-4)."
      finding_ids: [F-9]
      asset_findings: []
      constraint_findings: []
      dimensions: [D3]
      closes_gap_profile:
        - { criterion: D3.5.1, result: RES-10, target: 3 }
      target_position: TGT-2
      option_set:
        - { id: OPT-4, description: "Lightweight decision records and an interface inventory covering the onboarding stream." }
      significance:
        strategic_importance: { level: low, basis: ["Criticality overlay low on the decision-path region (RES-10)"] }
        modernization_need: { level: medium, basis: [F-9] }
        future_demand: { level: low, basis: ["No recorded anticipated demand on this subject region"] }
        exposure: { level: low, basis: ["Risks known and within stated tolerance; no exposure finding in this region"] }
        value_potential: { level: low, basis: ["No documented value expectation for documentation consolidation"] }
        urgency: { level: low, basis: ["No characterized trigger within the planning horizon"] }
        feasibility: { level: high, basis: [OPT-4] }
        readiness: { level: medium, basis: [RES-07] }
        dependency: { level: low, basis: ["Enables or blocks nothing else in this assessment"] }
      profile:
        primary: standby
        rationale: "No profile condition satisfied: need medium (one moderate finding), future demand low, exposure low, value potential low, urgency low; reported as standby with a recorded review date, never force-fit (R-PRI-4)."
      status: standby
      review_date: "2026-11-20"
  objectives:
    - id: OBJ-1
      opportunity: O-1
      statement: "Consolidate onboarding onto a single customer identity with automated KYC orchestration."
      success_criterion: "Every new journey and the two highest-volume journeys onboard through the identity service with automated KYC checks inside stated tolerance."
      barrier_removed: "Journey changes stop requiring coordinated tri-application releases; F-5 is removed by decoupling."
      domain_criterion: D4.1.1
      effort: medium
      recommended_timestamp: "2026-H2"
      recency: high
      rating: "Primary modernization objective of O-1"
      reviewing: "Architecture Review Board (insurer)"
      review: "Reviewed with the compliance readiness envelope; scheduled"
      review_date: "2026-08-20"
      dependencies:
        - { type: enables, listed_in: dependencies, id: O-2, basis: "A consolidated identity service retires the undocumented tri-application decision paths, making the standby documentation work trivial." }
  target_positions:
    - id: TGT-1
      statement: "Straight-through digital onboarding on a single customer identity, with KYC checks automated inside stated tolerance."
      derived_from_results: [RES-09]
      opportunity: O-1
