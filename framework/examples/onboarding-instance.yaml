# AMAF worked example instance: customer onboarding modernization.
# A multi-domain subject in a different organisational context than the
# integration example: one value stream (customer onboarding) assessed as
# one capability-level subject, fanning out into business, data, software,
# technology, and implementation implications (ROADMAP S7).
# Sections: assessment_instance (package: assessment), opportunity_set
# (package: modernization opportunity), contextualization (package:
# architecture contextualization), realization (package: modernization
# realization). The realization tail is an illustrative extension marked
# informative in the framework README.
# This assessment runs under assessment_rules v1 and interpretation_rules v2
# (catalog v0.4.1): it exercises the sustained-overshoot constraint finding
# (RES-08, F-7), the standby opportunity (O-2), and the maturity bridge
# evidence path (EV-12 into RES-07).

assessment_instance:
  metamodel: "ama-metamodel 1.0.0"
  assessment:
    id: AS-EXAMPLE-onboarding
    organization: "Example mutual insurer (worked example)"
    date: "2026-05-20"
    framework: { id: ama-framework, version: "0.4.1" }
    rules: { assessment_rules: 1, interpretation_rules: 2 }
    scope: "The customer onboarding value stream end to end: journey front end, identity verification and KYC checks, policy issuance, and the applications and data stores that support them, assessed as one capability-level subject."
    out_of_scope: ["Claims processing", "Product pricing and actuarial systems", "Intermediary-facing portals"]
    status: recorded
  subjects:
    - id: SUB-1
      name: "Customer onboarding (value stream and supporting architecture)"
      kind: capability
  results:
    - id: RES-01
      subject: SUB-1
      criterion: D2.3.1
      assessment_type: exposure
      applicable: yes
      score: 2
      target: 3
      gap: 1
      criticality: critical
      confidence: high
      tolerance: outside
      commentary: "Incoming digital identity verification regulation lands with a fixed 2027 deadline; a majority of KYC checks in the onboarding stream are manual, outside stated compliance tolerance on a critical region."
      recommendation: "Automate identity verification checks ahead of the regulatory deadline; see the implication set of opportunity O-1."
      status: recorded
    - id: RES-02
      subject: SUB-1
      criterion: D4.1.1
      assessment_type: condition
      applicable: yes
      score: 2
      target: 3
      gap: 1
      criticality: high
      confidence: high
      commentary: "Onboarding journeys stall on incomplete customer data and manual re-entry; the straight-through rate is 31 percent against a 70 percent design intent."
      recommendation: "Redesign the journey on captured-once customer data behind a single identity."
      status: recorded
    - id: RES-03
      subject: SUB-1
      criterion: D5.4.1
      assessment_type: condition
      applicable: yes
      score: 1
      target: 4
      gap: 3
      criticality: high
      confidence: high
      anchor_rationale: "Anchor: customer identity and eligibility logic duplicated across three onboarding applications with no consolidation decision; two of them re-implement the same identity-proofing flow independently."
      commentary: "Customer identity and eligibility logic is fragmented and duplicated across the onboarding estate."
      recommendation: "Consolidate onto a single customer identity service; retire duplicated proofing logic."
      status: recorded
    - id: RES-04
      subject: SUB-1
      criterion: D2.4.1
      assessment_type: demand
      applicable: yes
      score: 2
      target: 3
      gap: 1
      criticality: high
      confidence: medium
      committed: true
      commentary: "The distribution strategy commits to same-week digital onboarding; support analytics attribute churn partly to onboarding friction."
      recommendation: "Grow digital onboarding capacity on the consolidated design rather than adding manual checkers."
      status: recorded
    - id: RES-05
      subject: SUB-1
      criterion: D4.3.2
      assessment_type: changeability
      applicable: yes
      score: 2
      target: 4
      gap: 2
      criticality: medium
      confidence: high
      commentary: "Journey changes require coordinated releases across the three onboarding applications; change lead time on the stream is long and risky."
      recommendation: "Decouple the journey assembly from the three applications; introduce independently changeable components."
      status: recorded
    - id: RES-06
      subject: SUB-1
      criterion: D1.1.1
      assessment_type: condition
      applicable: yes
      score: 4
      target: 4
      gap: 0
      criticality: high
      confidence: high
      commentary: "The onboarding value stream carries the growth strategy's distribution objectives; its target journey design is an agreed strategic asset."
      recommendation: "Hold the strategic anchor; use it as the target position for consolidation."
      status: recorded
    - id: RES-07
      subject: SUB-1
      criterion: D7.4.1
      assessment_type: readiness
      applicable: yes
      score: 3
      target: 4
      gap: 1
      criticality: medium
      confidence: high
      commentary: "Delivery capacity is adequate: CI/CD and automated regression exist on the front end; the organization's modernization practice sits at band L-3 (Systematic), corroborating the delivery record as practice evidence under the maturity bridge."
      recommendation: "Use the existing pipeline and automation assets for the consolidation; no preparatory initiative required."
      status: recorded
    - id: RES-08
      subject: SUB-1
      criterion: D6.2.1
      assessment_type: exposure
      applicable: yes
      score: 5
      target: 3
      gap: -2
      criticality: high
      confidence: high
      tolerance: inside
      anchor_rationale: "Anchor: the identity-proofing and fraud control stack materially exceeds the assurance profile the stream is required to meet; the deliberate-excess review sustains the overshoot because the committed regulatory direction (D2.3.1) will consume the headroom."
      commentary: "Fraud and trust controls overshoot the stated target assurance level; the deliberate-excess review sustains the excess deliberately."
      recommendation: "Hold the controls; review the target rationale upward instead of trimming capability."
      status: recorded
    - id: RES-09
      subject: SUB-1
      criterion: D8.1.1
      assessment_type: target
      applicable: yes
      score: 4
      target: 4
      gap: 0
      criticality: high
      confidence: high
      commentary: "The target journey design (straight-through digital onboarding on a single customer identity with automated KYC orchestration) is defined and agreed with compliance."
      recommendation: "Hold the target; anchor the staged consolidation on it."
      status: recorded
    - id: RES-10
      subject: SUB-1
      criterion: D3.5.1
      assessment_type: condition
      applicable: yes
      score: 2
      target: 3
      gap: 1
      criticality: low
      confidence: medium
      commentary: "Onboarding architecture documentation covers the front-end journeys only; the KYC routing decision paths and the issuance interfaces are undocumented."
      recommendation: "Record the decision paths and interfaces for the onboarding stream."
      status: recorded
  evidence:
    - id: EV-01
      subject: SUB-1
      criterion: D2.3.1
      result: RES-01
      description: "Compliance readiness review: 62 percent of KYC checks in the onboarding stream are executed manually; the regulator consultation paper sets a fixed 2027 enforcement date for automated digital identity verification."
      class: direct
      source: "Regulatory readiness review worksheet"
      date: "2026-04-14"
      relation: supports
      status: recorded
    - id: EV-02
      subject: SUB-1
      criterion: D2.3.1
      result: RES-01
      description: "Internal audit extract: manual check error rates cluster at the same steps the regulator names; the compliance tolerance statement marks the region critical."
      class: indirect
      source: "Internal audit report 2026-Q1"
      date: "2026-04-03"
      relation: supports
      status: recorded
    - id: EV-03
      subject: SUB-1
      criterion: D4.1.1
      result: RES-02
      description: "Journey telemetry extract: straight-through processing rate 31 percent against the 70 percent design intent; median onboarding cycle time 18 days."
      class: direct
      source: "Journey telemetry dashboard 2026-Q2"
      date: "2026-05-08"
      relation: supports
      status: recorded
    - id: EV-04
      subject: SUB-1
      criterion: D4.1.1
      result: RES-02
      description: "Complaint and rework analysis: the dominant complaint theme is repeated document requests caused by incomplete captured data."
      class: indirect
      source: "Complaint register analysis 2026-Q1"
      date: "2026-04-20"
      relation: supports
      status: recorded
    - id: EV-05
      subject: SUB-1
      criterion: D5.4.1
      result: RES-03
      description: "Application portfolio review: identity and eligibility logic implemented in three onboarding applications; two re-implement the same identity-proofing flow; no consolidation decision recorded for any of them."
      class: direct
      source: "Onboarding estate inventory worksheet 2026-04"
      date: "2026-04-28"
      relation: supports
      status: recorded
    - id: EV-06
      subject: SUB-1
      criterion: D5.4.1
      result: RES-03
      description: "The last compliance rule change required a coordinated three-team change across all three implementations; the coordination record shows four weeks of alignment work for one shared rule."
      class: indirect
      source: "Compliance change coordination record 2026-Q1"
      date: "2026-03-30"
      relation: supports
      status: recorded
    - id: EV-07
      subject: SUB-1
      criterion: D2.4.1
      result: RES-04
      description: "Distribution strategy 2026 commits to same-week digital onboarding for direct channels; churn survey attributes 9 percent of early-tenure churn to onboarding friction."
      class: direct
      source: "Distribution strategy 2026 and churn survey 2026-Q1"
      date: "2026-04-10"
      relation: supports
      status: recorded
    - id: EV-08
      subject: SUB-1
      criterion: D4.3.2
      result: RES-05
      description: "Release records: a journey-affecting change requires coordinated releases in three applications; median lead time nine weeks against a two-week portfolio median."
      class: direct
      source: "Release train records 2025-Q4 to 2026-Q2"
      date: "2026-05-12"
      relation: supports
      status: recorded
    - id: EV-09
      subject: SUB-1
      criterion: D4.3.2
      result: RES-05
      description: "Change advisory queue analysis: onboarding journey changes accumulate sequencing waits triggered by the tri-application coupling."
      class: indirect
      source: "Change advisory analysis 2026-Q1"
      date: "2026-04-25"
      relation: supports
      status: recorded
    - id: EV-10
      subject: SUB-1
      criterion: D1.1.1
      result: RES-06
      description: "Strategy map review: the 2026 growth strategy names digital onboarding as a headline capability with dedicated distribution outcomes."
      class: direct
      source: "Growth strategy map 2026"
      date: "2026-05-02"
      relation: supports
      status: recorded
    - id: EV-11
      subject: SUB-1
      criterion: D1.1.1
      result: RES-06
      description: "Investment committee minutes reference the onboarding target journey design verbatim in the 2026 modernization envelope."
      class: indirect
      source: "Investment committee minutes 2026-05"
      date: "2026-05-15"
      relation: supports
      status: recorded
    - id: EV-12
      subject: SUB-1
      criterion: D7.4.1
      result: RES-07
      description: "Architecture Modernization Maturity Model result: practice band L-3 Systematic (canonical instance dea:maturity-bands-v2), dated 2026-04-30, scoped to the organization's modernization practice; enters as one direct-class practice evidence item for the readiness criterion under the maturity bridge (R-MB1, R-MAT-1)."
      class: direct
      source: "Maturity model assessment record 2026-04"
      date: "2026-04-30"
      relation: supports
      status: recorded
    - id: EV-13
      subject: SUB-1
      criterion: D7.4.1
      result: RES-07
      description: "Corroborating delivery records from the subject's own change history: the journey front end ships through CI/CD with automated regression suites in the pipeline."
      class: indirect
      source: "Front-end delivery records 2026-Q1 to Q2"
      date: "2026-05-10"
      relation: supports
      status: recorded
    - id: EV-14
      subject: SUB-1
      criterion: D6.2.1
      result: RES-08
      description: "Assurance profile mapping: the deployed identity-proofing and fraud controls sit two levels above the assurance profile the stream is required to meet."
      class: direct
      source: "Security assurance review worksheet"
      date: "2026-05-05"
      relation: supports
      status: recorded
    - id: EV-15
      subject: SUB-1
      criterion: D6.2.1
      result: RES-08
      description: "Fraud loss trend is near zero against peer benchmarks at the same product mix, corroborating the overshoot reading rather than a scoring error."
      class: indirect
      source: "Fraud benchmark report 2025"
      date: "2026-02-15"
      relation: supports
      status: recorded
    - id: EV-16
      subject: SUB-1
      criterion: D8.1.1
      result: RES-09
      description: "Target journey design workshop: the agreed target statement names straight-through digital onboarding on a single customer identity with automated KYC orchestration, reviewed with compliance against the regulatory timeline."
      class: direct
      source: "Target journey design workshop notes"
      date: "2026-05-10"
      relation: supports
      status: recorded
    - id: EV-17
      subject: SUB-1
      criterion: D3.5.1
      result: RES-10
      description: "Documentation coverage review: front-end journey documentation exists; the KYC routing decision paths and issuance interfaces have no current documentation."
      class: direct
      source: "Documentation coverage review worksheet"
      date: "2026-04-22"
      relation: supports
      status: recorded
  findings:
    - id: F-1
      subject: SUB-1
      class: exposure
      severity: severe
      statement: "Manual KYC checks sit outside stated compliance tolerance on a critical region, against a fixed 2027 regulatory deadline."
      basis: [RES-01]
      evidence: [EV-01, EV-02]
      status: recorded
    - id: F-2
      subject: SUB-1
      class: deficiency
      severity: material
      statement: "Onboarding journeys stall on incomplete customer data; straight-through processing is 31 percent against intent."
      basis: [RES-02]
      evidence: [EV-03, EV-04]
      status: recorded
    - id: F-3
      subject: SUB-1
      class: deficiency
      severity: severe
      statement: "Customer identity and eligibility logic is fragmented and duplicated across three applications (gap 3)."
      basis: [RES-03]
      evidence: [EV-05, EV-06]
      status: recorded
    - id: F-4
      subject: SUB-1
      class: demand
      severity: material
      statement: "Committed same-week digital onboarding demand exceeds the demonstrated capacity of the stream."
      basis: [RES-04]
