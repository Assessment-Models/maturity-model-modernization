      notes: "R-GAP-2 deliberate-excess review note on RES-08, sustained: the finding constrains the target rationale, not the subject, and lands in the residual minor row (R-FND-4, R-SEV-4, interpretation_rules v2)."
      status: recorded
    - id: F-8
      subject: SUB-1
      class: strength
      statement: "The target journey design is defined and agreed with compliance, viable against exposures and readiness."
