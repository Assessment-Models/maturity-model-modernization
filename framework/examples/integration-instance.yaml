realization:
  metamodel: "ama-metamodel 1.0.0"
  assessment: AS-EXAMPLE-integration
  interventions:
    - id: IV-1
      opportunity: O-1
      statement: "Standardize integration as managed services with shared contracts."
      rationale: "Closes the gap profile of O-1 (RES-01..RES-05) by consolidating onto the target position anchored by RES-07; the staged shape respects F-3 and the preparatory path respects F-6."
      profile: critical
      status: committed
  capability_implications:
    - { id: CAP-1, intervention: IV-1, capability: "Automated integration regression testing", kind: introduces, affected_dimension: D7.4.1, notes: "Closes constraint F-6; the preparatory capability of P-1." }
    - { id: CAP-2, intervention: IV-1, capability: "Integration service contract governance and discoverability", kind: introduces, affected_dimension: D4.4.1, notes: "Anchors the fan-out implications IMP-ENT-1..IMP-TEC-1." }
  decisions:
    - id: DEC-1
      statement: "Adopt the managed integration service pattern with contract-first onboarding."
      intervention: IV-1
      decides: IV-1
      status: accepted
      date: "2026-05-15"
      options_considered: [OPT-1, OPT-2, OPT-3]
      consequences: "Option set of O-1 resolved in favor of OPT-1; staged rollout with a readiness re-assessment gate before each stage commits."
      decided_by: "Architecture Review Board"
  initiatives:
    - id: INIT-0
      statement: "Automated integration testing capability (P-1)."
      objectives: [OBJ-1]
      closes_findings: [F-6]
      stages:
        - { id: stage-1, name: "Automated regression coverage for the top integration flows", status: realized, start: "2026-05-20", end: "2026-08-20", target: "Regression tests in CI for the two highest-criticality integration paths", closes: [F-6], outputs: ["Shared test capability and interface contracts in CI"] }
      depends_on: []
      status: realized
    - id: INIT-1
      statement: "Staged integration service standardization."
      intervention: IV-1
      preparatory: [INIT-0]
      objectives: [OBJ-1]
      stages:
        - { id: stage-1, name: "Contract-first pilot on two partner flows", status: realized, start: "2026-06-01", end: "2026-09-30", target: "Pilot flows live on the shared contract pattern with automated regression", closes: [F-1, F-5], outputs: ["Service contract template", "Discoverability registry (pilot)"] }
        - { id: stage-1-gate, name: "Re-assessment gate", status: realized, target: "Readiness re-scored before the next stage commits (D7.4.1)", outputs: [] }
        - { id: stage-2, name: "Estate rollout with dependency tolerance work", status: in-progress, start: "2026-10-01", target: "Mechanisms consolidated onto the standard pattern; exposures inside tolerance", closes: [F-2, F-3, F-4], outputs: ["Managed interface inventory", "Retired point-to-point interfaces"] }
      depends_on: [INIT-0]
      status: in-progress
  outcomes:
    - id: OUT-1
      initiative: INIT-1
      statement: "Partner integrations onboard through the shared service contract pattern."
      status: observed
      expected: "New partner integrations use the standard contract pattern with automated regression coverage before production exposure."
      observed: "The first two pilot partner flows onboarded on the pattern; onboarding lead time for the pilot reduced from four months to seven weeks."
      date: "2026-09-30"
      measure: "Onboarding lead time and regression escape rate, per the OBJ-1 success criterion."
      evidence: ["Pilot onboarding records 2026-Q3", "Release records 2026-Q3"]
  value_realizations:
    - id: VR-1
      outcome: OUT-1
      opportunity: O-1
      statement: "Faster, lower-risk partner onboarding on the standardized integration pattern."
      status: evidenced
      expected: "Reduced partner onboarding effort and integration defect escape, consistent with the value factors recorded for O-1."
      evidenced: "Pilot onboarding lead time reduced to seven weeks with zero pilot-scope production incidents in the first quarter."
      measure: { id: integration-onboarding-lead-time, version: "1.0.0" }
      date: "2026-09-30"
      successor_assessment: null
      basis_findings: [F-1, F-5]
