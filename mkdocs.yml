site_name: AMAF
site_description: Architecture Modernization Assessment Framework - one modernization assessment foundation, multiple architectural interpretations, coordinated realization.
repo_url: https://github.com/Assessment-Models/maturity-model-modernization
repo_name: Assessment-Models/maturity-model-modernization
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Framework:
      - The Problem: framework/01-the-problem.md
      - Conceptual Model: framework/02-conceptual-model.md
      - Central Proposition: framework/03-central-proposition.md
      - Glossary: framework/glossary.md
  - Taxonomy:
      - Overview: taxonomy/overview.md
      - D1 Strategic Alignment & Relevance: taxonomy/d1-strategic-alignment.md
      - D2 Drivers & Environmental Context: taxonomy/d2-drivers-context.md
      - D3 Architecture Baseline & Condition: taxonomy/d3-architecture-baseline.md
      - D4 Architectural Fitness & Performance: taxonomy/d4-fitness-performance.md
      - D5 Structural Integrity & Complexity: taxonomy/d5-structural-integrity.md
      - D6 Exposure, Risk & Sustainability: taxonomy/d6-exposure-risk.md
      - D7 Adaptability & Modernization Readiness: taxonomy/d7-adaptability-readiness.md
      - D8 Target State & Modernization Value: taxonomy/d8-target-state-value.md
  - Methodology:
      - Assessment Scales & Attributes: methodology/assessment-scales.md
      - The Evidence Model: methodology/evidence-model.md
      - Scoring Mechanics: methodology/scoring-mechanics.md
      - Evidence Mechanics: methodology/evidence-mechanics.md
      - Aggregation, Gap & Weighting: methodology/aggregation-mechanics.md
      - The Maturity Model Bridge: methodology/maturity-bridge.md
      - Interpretation Logic: methodology/interpretation-logic.md
      - Prioritization & Decision Logic: methodology/prioritization.md
  - Contextualization:
      - Fan-Out Model: contextualization/fan-out-model.md
      - Domain Packs: contextualization/domain-packs.md
  - Metamodel:
      - Entities: metamodel/entities.md
      - Relationships: metamodel/relationships.md
      - The Criterion Model: metamodel/criterion-model.md
  - Realization:
      - Assessment Outputs: realization/outputs.md
      - Maturity vs Modernization: realization/maturity-vs-modernization.md
      - Model Structure & Sequence: realization/model-structure.md
  - Examples:
      - Integration Architecture: examples/integration-architecture.md
