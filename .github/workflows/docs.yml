name: Deploy AMAF docs site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material mkdocs-material-extensions
      - name: Run mkdocs build --strict
        run: |
          set -o pipefail
          if ! mkdocs build --strict 2>&1 | tee mkdocs-build.log; then
            echo "Build failed; surfacing output as check annotations:"
            {
              grep -iE 'warning|error|abort|exception|traceback|config|link|deprecat' mkdocs-build.log | head -10 \
                | awk '{ printf "::error title=mkdocs issue %d::%s\n", NR, $0 }'
              tail -5 mkdocs-build.log \
                | awk '{ printf "::error title=mkdocs tail %d::%s\n", NR, $0 }'
            }
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
